<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documents Tab Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #1a1a1a; color: white; }
        .card { background: #2a2a2a; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .form-control { padding: 8px; margin: 5px 0; border-radius: 4px; border: 1px solid #444; background: #333; color: white; }
        .btn { padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; margin: 5px; }
        .btn-primary { background: #007bff; color: white; }
        .btn-secondary { background: #6c757d; color: white; }
        .status-message { padding: 10px; margin: 10px 0; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        .loading { text-align: center; padding: 20px; color: #888; }
        .table-container { margin-top: 20px; }
        .data-table { width: 100%; border-collapse: collapse; }
        .data-table th, .data-table td { padding: 12px; text-align: left; border-bottom: 1px solid #444; }
        .data-table th { background: #333; }
        .btn-small { padding: 5px 10px; font-size: 12px; }
        .btn-danger { background: #dc3545; color: white; }
    </style>
</head>
<body>
    <h1>📄 Documents Tab Test</h1>
    
    <div class="card">
        <h2>📤 Upload New Document</h2>
        <div>
            <label for="docCategory">Document Category:</label>
            <select id="docCategory" class="form-control">
                <option value="general">General</option>
                <option value="tax">Tax Documents</option>
                <option value="bank">Bank Statements</option>
            </select>
        </div>
        <div>
            <label for="docFile">Select File:</label>
            <input type="file" id="docFile" class="form-control" accept=".pdf,.png,.jpg,.jpeg,.txt">
        </div>
        <div>
            <button class="btn btn-primary" onclick="uploadDocument()">📤 Upload & Process</button>
        </div>
        <div id="uploadStatus" class="status-message" style="display: none;"></div>
    </div>

    <div class="card">
        <h2>📚 Your Documents</h2>
        <button class="btn btn-primary" onclick="loadDocuments()">🔄 Refresh</button>
        <div id="documentsTable" class="table-container">
            <div class="loading">Click Refresh to load documents...</div>
        </div>
    </div>

    <div class="card">
        <h2>🧪 Function Tests</h2>
        <button class="btn btn-secondary" onclick="testFunctions()">Test All Functions</button>
        <div id="testResults"></div>
    </div>

    <script>
        const API_BASE = 'http://127.0.0.1:8000';
        
        // Test function to check if everything is working
        function testFunctions() {
            const results = document.getElementById('testResults');
            let html = '<h3>Function Test Results:</h3><ul>';
            
            // Test if functions exist
            const functions = ['uploadDocument', 'loadDocuments', 'deleteDocument'];
            functions.forEach(fn => {
                html += `<li>${fn}: ${typeof window[fn] === 'function' ? '✅ Available' : '❌ Missing'}</li>`;
            });
            
            // Test if elements exist
            const elements = ['docFile', 'docCategory', 'uploadStatus', 'documentsTable'];
            elements.forEach(id => {
                const el = document.getElementById(id);
                html += `<li>Element #${id}: ${el ? '✅ Found' : '❌ Missing'}</li>`;
            });
            
            html += '</ul>';
            results.innerHTML = html;
        }
    </script>
    
    <script src="http://127.0.0.1:8000/static/js/documents.js"></script>
</body>
</html>
