version: '3.8'

services:
  finance-api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
      - "3000:3000"  # Frontend dev server
    environment:
      - ENVIRONMENT=development
      - DATABASE_PATH=/app/data/duck.db
      - HERMES_URL=http://hermes:11434
    volumes:
      - .:/app
      - finance_data:/app/data
      - finance_logs:/app/logs
    depends_on:
      - hermes
    restart: unless-stopped

  hermes:
    image: ghcr.io/ggerganov/llama.cpp:server
    ports:
      - "11434:11434"
    environment:
      - HOST=0.0.0.0
      - PORT=11434
    volumes:
      - ./models:/models:ro
    command: >
      -m /models/hermes3-8b.Q4_K_M.gguf
      --host 0.0.0.0
      --port 11434
      -c 4096
      --keep -1
    restart: unless-stopped

volumes:
  finance_data:
  finance_logs: